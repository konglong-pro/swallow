[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swallow"
version = "0.1.0"
description = "An ingest-only toolkit that converts raw inputs into traceable Markdown documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0.1",
  "typer>=0.12.3",
  "ulid-py>=1.1.0",
]

[project.optional-dependencies]
markitdown = [
  "markitdown[docx,pdf,pptx,xlsx]==0.1.5",
]
ocr = [
  "paddleocr",
  "paddlepaddle==2.6.2",
  "pillow",
  "pypdfium2",
]
asr = [
  "faster-whisper",
  "imageio-ffmpeg",
]
service = [
  "fastapi",
  "httpx>=0.27",
  "python-multipart",
  "uvicorn",
]
mcp = [
  "mcp>=1.27,<2",
]
web = [
  "beautifulsoup4",
  "crawl4ai",
  "firecrawl-py",
  "markdownify",
  "playwright",
]
ci = [
  "fastapi",
  "firecrawl-py",
  "httpx>=0.27",
  "markdownify",
  "markitdown[docx,pdf,pptx,xlsx]==0.1.5",
  "mcp>=1.27,<2",
  "pillow",
  "pypdfium2",
  "python-docx",
  "python-multipart",
  "uvicorn",
]
all = [
  "beautifulsoup4",
  "crawl4ai",
  "faster-whisper",
  "fastapi",
  "firecrawl-py",
  "httpx>=0.27",
  "imageio-ffmpeg",
  "markdownify",
  "markitdown[docx,pdf,pptx,xlsx]==0.1.5",
  "mcp>=1.27,<2",
  "paddleocr",
  "paddlepaddle==2.6.2",
  "pillow",
  "playwright",
  "pypdfium2",
  "python-multipart",
  "uvicorn",
]

[project.scripts]
swallow = "swallow.cli.main:app"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mcp>=1.27,<2",
  "pytest>=8.2",
  "python-docx",
]

[tool.hatch.build.targets.wheel]
packages = ["src/swallow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "unit: fast unit tests",
  "contract: SDK and artifact contract tests",
  "transport: SDK transport backend tests",
  "local: local SDK backend tests",
  "http: HTTP SDK backend tests",
  "adapter: agent adapter tests",
  "integration: local integration tests without external network",
  "mcp: MCP server tests",
  "heavy: tests that need heavy optional runtimes or models",
  "network: tests that call external network services",
  "security: security boundary and malicious input tests",
  "performance: performance or stress tests",
  "api: service API tests",
  "batch: batch command and summary tests",
  "concurrency: concurrent ingest and batch isolation tests",
]
